---
layout: default
---

<main class="post yue">
  <header class="post-header">
    <h2>{{ page.title }}</h2>
    <p class="meta">{{ page.date | date: "%b %-d, %Y" }}{% if page.author %} • {{ page.author }}{% endif %}{% if
      page.meta %} • {{ page.meta }}{% endif %}</p>
  </header>
  <article class="post-content">
    {{ content }}
  </article>
  <footer class="post-footer">
  </footer>
</main>

<div class="comments">
  {% include comments.html %}
</div>
